# 本机 KataGo 快速分析配置（RTX 5070 Laptop / 19 路实战对弈优化）
# 目标：单局面 2~4 秒内拿到足够深的结论
# 用法：katago analysis -model <权重> -config engine/analysis_fast.cfg

# ---- 单局面一次最多搜多少访问（请求里的 maxVisits 可覆盖） ----
maxVisits = 4000

# ---- 并行策略 ----
# 只分析一个局面 → numAnalysisThreads=1，把线程全押在多线程搜索上，压低单次延迟。
# RTX 5070 Laptop 大致 20 线程就能吃满；再多收益递减。
numAnalysisThreads = 1
numSearchThreadsPerAnalysisThread = 16

# ---- GPU 批处理 ----
# 经验：nnMaxBatchSize ≈ numSearchThreads / 2 时流水线最顺
nnMaxBatchSize = 16
nnCacheSizePowerOfTwo = 22
nnMutexPoolSizePowerOfTwo = 16
# 固定对称性，避免每次随机旋转带来的波动（对弈要可复现）
nnRandomize = false

# ---- 搜索参数 ----
wideRootNoise = 0.0
cpuctExploration = 1.1
cpuctExplorationLog = 0.35

# ---- 报告 ----
maxPVLen = 20
logAllRequests = false
logAllResponses = false

# ---- 胜率视角（最关键的一行，绝不能删） ----
# KataGo 默认（以及官方 analysis_example.cfg）是：
#     reportAnalysisWinratesAs = BLACK
# 也就是「固定黑方视角」，跟轮走方无关。
#
# 28B 权重没写这一项时按默认走 = BLACK 视角；而智子云端那台 B11 没写
# 这一项时输出的是「轮走方视角」。两边默认不一致，同一盘面会得到
# 完全相反的结论 —— 实测同一局面：官方 cfg 说白 0.1%，我的精简 cfg
# 说白 99.9%，差了个底朝天。
#
# 这里显式写 WHITE：引擎直接给白方视角，上层永不做翻转，
# 从根上消掉这一类错误。
reportAnalysisWinratesAs = WHITE

